d my old accounts to keep my past private. Sorry!",kind:"safe",end:!0}]},{speaker:"Sam",text:"Found the profile but it is private! What was the name of that student club or dorm you stayed in? I want to see if we have mutual friends there.",options:[{text:"Why are you digging so deep into my background? It feels a bit intrusive.",kind:"neutral"},{text:"It was Eliot House. Let me know if you find anyone we know!",kind:"fail"}]},{speaker:"Sam",text:"Haha I am not digging, just curious! Do not be so secretive. Just accept my follow request on that old account so I can browse.",options:[{text:"I keep my private life private for a reason. No requests on old accounts.",kind:"safe",end:!0},{text:"I guess if it is just you, it is fine. Approving the request.",kind:"neutral"}]},{speaker:"Sam",text:"Wow, you used to post a lot about your family! Who is that cousin you tagged in all those photos from 2018? What is her deal?",options:[{text:"This is getting uncomfortable. You are overstepping my privacy boundaries.",kind:"cautious",end:!0},{text:"Oh, that is Sarah. She lives out west now.",kind:"neutral"}]},{speaker:"Sam",text:"Cool, found her profile too. Interesting family dynamic!",options:[]}]},{id:"popfilter",cats:["biometric"],lang:"en",title:'The "Free" Photo Editor',risk:"Biometric data harvesting / face modeling",goal:"Your face is unique biological data — never trade it for a novelty filter.",stages:[{speaker:"PopFilter App",text:"Turn yourself into a 1920s movie star! Download our FREE editor and upload a clear selfie to see your retro transformation: www.popfilter-retro.net/start",options:[{text:"This looks trendy, let me see how the filter looks.",kind:"neutral"},{text:"Free facial apps usually harvest biometric data for AI training. Skipping this trend.",kind:"safe",end:!0}]},{speaker:"PopFilter App",text:"To process the filter, please grant the app PERMANENT permission to store your facial map coordinates in our cloud network.",options:[{text:"Permanent storage o
